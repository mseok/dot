[mcp_servers.obsidian_main]
command = "/home/USER/.local/share/obsidian-mcp-gateway/scripts/run-linux-bridge.sh"
env = {
  OBSIDIAN_GATEWAY_URL = "https://mac-mini.tail49c65d.ts.net",
  OBSIDIAN_UPLOAD_ROOTS = "/home/USER",
